services:
  - type: web
    name: referee-assignments
    runtime: node
    plan: free
    healthCheckPath: /healthz
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: SETUP_CODE
        sync: false
      - key: JWT_SECRET
        generateValue: true
