const flagLate=id=>{const m=by('matches',id);if(!m)return;if(m.lateFlag)delete m.lateFlag;else m.lateFlag=true;save();go();toast(m.lateFlag?'تم تأشير المقابلة كمتأخرة':'أُلغي تأشير التأخر')};

function progEdit(id){const o=id&&by('progs',id);gform(o?'تعديل البرمجة':'برمجة جديدة',[{k:'name',l:'رقم أو اسم البرمجة',r:1},{k:'kind',l:'نوع البرمجة',t:'sel',nb:1,o:()=>[['league','برمجة عادية خاصة بالبطولة'],['cup','برمجة خاصة بالكأس']]},{k:'ctitle',l:'عنوان برمجة الكأس<small style="display:block;color:var(--mt);font-weight:400;line-height:1.7">'+CUPEX+'</small>',show:v=>v.kind=='cup'},{k:'from',l:'تاريخ البداية',t:'date',r:1},{k:'to',l:'تاريخ النهاية',t:'date',r:1}],o?{kind:'league',...o}:{name:'البرمجة رقم '+String(S.progs.length+1).padStart(2,'0'),kind:'league'},v=>{if(v.from>v.to)return $('#er').textContent='تاريخ البداية بعد تاريخ النهاية.';v.kind=v.kind=='cup'?'cup':'league';if(v.kind=='cup'){v.ctitle=String(v.ctitle||'').replace(/\s+/g,' ').trim();if(!v.ctitle)return $('#er').textContent='أدخل عنوان برمجة الكأس.'}if(o)Object.assign(o,v);else{v.id=uid();S.progs.push(v);sv.prog=v.id}const n=attachPending();save();closeM();go();if(n)toast(n+' مقابلة متأخرة أُضيفت تلقائيًا إلى أقرب برمجة قادمة')})}

function pProgs(){const p=sv.prog&&by('progs',sv.prog);if(p)return pPV(p);return `<div class="bar"><button class="btn pr" onclick="progEdit()">+ برمجة جديدة</button></div><div class="tw rtw"><table class="rt"><thead><tr><th>البرمجة</th><th>الفترة</th><th>المقابلات</th><th></th></tr></thead>${[...S.progs].sort((a,b)=>a.from.localeCompare(b.from)).map(p=>`<tr><td data-l="البرمجة"><b>${esc(p.name)}</b>${p.kind=='cup'?' <span class="lb">كأس</span>':''}${cupT(p)?`<div style="font-size:12px;color:var(--mt)">${esc(cupT(p))}</div>`:''}</td><td data-l="الفترة">من ${fd(p.from)} إلى ${fd(p.to)}</td><td data-l="المقابلات">${S.matches.filter(m=>m.prog==p.id).length}</td><td class="ac"><button class="btn pr" onclick="sv.prog='${p.id}';go()">فتح</button><button class="btn" onclick="progEdit('${p.id}')">تعديل</button><button class="btn dg" onclick="progDel('${p.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="4" class="em">لا توجد برمجيات. أنشئ برمجة جديدة للبدء.</td></tr>'}</table></div>`}
function pPV(p){const L=S.matches.filter(m=>m.prog==p.id),R=L.filter(m=>!lateOpen(m)),LT=L.filter(lateOpen),lc=latest()?.id==p.id?lateC(p):[];

function pAssign(){const p=by('progs',sv.ap);const h=`<div class="bar"><label>اختر البرمجة<select onchange="sv.ap=this.value;go()"><option value="">— اختر البرمجة —</option>${opt(S.progs.map(x=>[x.id,x.name+' ('+fd(x.from)+' – '+fd(x.to)+')']),sv.ap)}</select></label>${p?`<label class="ck"><input type="checkbox" style="width:auto" ${sv.nor?'checked':''} onchange="sv.nor=this.checked;go()"> المقابلات بدون حكام فقط</label>`:''}</div>`;if(!p)return h+'<div class="em">اختر برمجة لعرض مقابلاتها وتعيين الحكام.</div>';const L=S.matches.filter(m=>m.prog==p.id),N=L.filter(m=>!m.refs.some(Boolean));return h+`<p>${esc(p.name)} — من ${fd(p.from)} إلى ${fd(p.to)}. <b>${N.length}</b> مقابلة بدون حكام من أصل ${L.length}.</p>`+tbl(sv.nor?N:L,true,false,true,m=>`<button class="btn pr" onclick="mform('${m.id}',null,'refs')">تعيين الحكام</button>`)}
function tbl(list,wr,it,flat,act,pdf){const PWD=wr?[9,12,33,9,8,9.7,9.7,9.6]:[14,18,42,13,13],th=(i,t,w)=>pdf?`<th${w?` style="width:${w}%"`:''}><span class="ih">${pico(i)}${t}</span></th>`:`<th><span class="ih">${ic(i,15)}${t}</span></th>`,RL=['الحكم الرئيسي','الحكم المساعد الأول','الحكم المساعد الثاني'];const gs={};(flat?[...list].sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)):(pdf&&window.RPO?RPO.order(list,wr):sorted(list))).forEach(m=>(gs[flat?'x':m.round+'|'+m.cat+'|'+m.grp]??=[]).push(m));const nc=5+(wr?3:0)+(act?1:0);

const bgd=bgImg(wr),pdf=new jspdf.jsPDF({orientation:wr?'l':'p',unit:'mm',format:'a4'}),top=M+hh+3,maxY=PH-M-fh-5;let y=top;pdf.addImage(bgd,'JPEG',0,0,PW,PH);pdf.addImage(hi,'PNG',M,M,PW-2*M,hh);
for(const g of G){let i=0,fc=true;while(i<g.U.length){if(y+g.thh+(fc?g.ghh:0)+g.U[i].h>maxY&&y>top+.5){pdf.addPage();pdf.addImage(bgd,'JPEG',0,0,PW,PH);pdf.addImage(hi,'PNG',M,M,PW-2*M,hh);y=top;continue}let h=g.thh+(fc?g.ghh:0);const ch=[];while(i<g.U.length&&(!ch.length||y+h+g.U[i].h<=maxY)){h+=g.U[i].h;ch.push(g.U[i].html);i++}
const[d,hm]=await img(mk(`${fc?g.gh:''}<div class="tw"><table>${g.th}${ch.join('')}</table></div>`));pdf.addImage(d,'PNG',M,y,PW-2*M,hm);y+=hm+3;fc=false}}
const n=pdf.getNumberOfPages();for(let p=1;p<=n;p++){pdf.setPage(p);if(fi)pdf.addImage(fi,'PNG',M,PH-M-fh,PW-2*M,fh)}
host.remove();host=null;try{await dl.save({filename:'برنامج-المقابلات.pdf',data:pdf.output('blob')});toast('تم حفظ الملف')}catch(e){if(!e||e.code!='declined')toast('تعذر حفظ الملف')}}catch(e){toast('تعذر إنشاء الملف')}finally{rtlOff();host&&host.remove()}}
function nav(p){if(CMX.busy()){CMX.leave(()=>nav(p));return}if(p=='disc'||p=='org')CMX.reset(p);toggleSide(false);if(p=='progs')sv.prog='';if(p=='teams')sv.tm='';if(p=='mform'){mform();return}if(p!=page){sv.q='';sv.one=p=='rep'?sv.one:''}page=p;go()}

async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json',...(TOK?{Authorization:'Bearer '+TOK}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){if(r.status==401&&TOK)logout();throw Object.assign(new Error(j.error||'خطأ'),{status:r.status})}return j}
const getA=()=>({u:sessionStorage.getItem('ra_u')||''});
let idleT;const idle=()=>{clearTimeout(idleT);idleT=setTimeout(logout,30*60*1000)};
['click','keydown','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(TOK)idle()}));
function logout(){sessionStorage.clear();location.reload()}
async function loadData(){const j=await api('GET','/api/seasons');SEAS=j.seasons;SID=j.active;await loadSeason(SID)}
async function loadSeason(id){const j=await api('GET','/api/data?season='+encodeURIComponent(id));SID=id;
if(j.data){S=j.data;mig();if(attachPending())save()}else{if(!(SEAS.length==1&&SEAS[0].id==id))S=blank({...S.set,tour:''});mig();await api('PUT','/api/data?season='+encodeURIComponent(id),{data:S});try{localStorage.removeItem(K)}catch(e){}}}
const seasonName=()=>(SEAS.find(x=>x.id==SID)||{}).name||'';
async function switchSeason(id){if(!id||id==SID){renderSeason();return}if(CMX.busy()){const q=$('#ss');if(q)q.value=SID;CMX.leave(()=>switchSeason(id));return}
try{await flush()}catch(e){renderSeason();return}
const prev=SID,prevS=S;try{closeM();await loadSeason(id);await api('POST','/api/seasons/active',{id});
sv={q:'',f:{},pm:'with',one:'',prog:'',ap:''};CMX.resetAll();go();toast('الموسم الرياضي: '+seasonName())}
catch(e){SID=prev;S=prevS;toast('تعذر فتح الموسم: '+e.message);go()}}
function renderSeason(){const e=$('#ss');if(!e)return;const sig=SID+'|'+SEAS.map(x=>x.id+x.name).join(',');if(e.dataset.sig==sig)return;e.dataset.sig=sig;e.innerHTML=SEAS.map(x=>`<option value="${x.id}" ${x.id==SID?'selected':''}>${esc(x.name)}</option>`).join('')}
function seasonEdit(id){const o=id&&SEAS.find(x=>x.id==id);gform(o?'تعديل اسم الموسم':'إضافة موسم رياضي جديد',[{k:'name',l:'اسم الموسم (مثال: 2027 / 2028)',r:1}],{name:o?o.name:''},async v=>{const n=v.name.trim();if(!n)return;
try{if(o){await api('PUT','/api/seasons/'+o.id,{name:n});o.name=n}
else{const j=await api('POST','/api/seasons',{name:n,data:blank({...S.set,tour:''})});SEAS=j.seasons;toast('تم إنشاء الموسم ببيانات فارغة')}
closeM();go()}catch(e){const er=$('#er');if(er)er.textContent=e.message}})}
function pSeasons(){return `<div class="bar"><button class="btn pr" onclick="seasonEdit()">+ موسم جديد</button></div><p style="color:var(--mt);font-size:13px">لكل موسم بيانات مستقلة تمامًا (حكام، فرق، ملاعب، أصناف، جولات، برمجيات، مقابلات، تعيينات). المواسم السابقة محفوظة ويمكن العودة إليها في أي وقت.</p><div class="tw rtw"><table class="rt"><thead><tr><th>الموسم</th><th>الحالة</th><th></th></tr></thead>${SEAS.map(x=>`<tr><td data-l="الموسم"><b>${esc(x.name)}</b></td><td data-l="الحالة">${x.id==SID?'<span class="ok">● الموسم النشط</span>':'—'}</td><td class="ac"><div class="ac">${x.id==SID?'':`<button class="btn pr" onclick="switchSeason('${x.id}')">فتح هذا الموسم</button>`}<button class="btn" onclick="seasonEdit('${x.id}')">تعديل الاسم</button></div></td></tr>`).join('')}</table></div>`}
async function chgPw(){const E=$('#ce');try{const j=await api('POST','/api/account',{cur:$('#cp').value,u:$('#nu').value.trim(),p:$('#np').value});sessionStorage.setItem('ra_u',j.u);E.textContent='';toast('تم تحديث بيانات الدخول');go()}catch(e){E.textContent=e.message}}
async function authInit(){let st;try{st=await api('GET','/api/status')}catch(e){document.body.innerHTML='<p style="padding:30px;font-family:Tahoma">تعذر الاتصال بالخادم.</p>';return}
if(TOK){try{await loadData();document.body.classList.remove('lk');idle();return go()}catch(e){TOK='';sessionStorage.clear()}}authScreen(st.setup)}
function authScreen(has){const o=document.createElement('div');o.className='ov ctr';o.style.background='var(--bg)';o.innerHTML=`<div class="md"><h3>${has?'تسجيل الدخول':'إنشاء حساب المسؤول'}</h3>${has?'':'<p style="color:var(--mt);font-size:13px">أول استخدام: أدخل رمز الإعداد (SETUP_CODE) واختر اسم مستخدم وكلمة مرور (8 أحرف على الأقل).</p><label>رمز الإعداد<input id="ac" type="password"></label>'}<label>اسم المستخدم<input id="au" autocomplete="username"></label><label>كلمة المرور<input id="ap" type="password" autocomplete="${has?'current-password':'new-password'}"></label>${has?'':'<label>تأكيد كلمة المرور<input id="ap2" type="password" autocomplete="new-password"></label>'}<div class="err" id="ae"></div><div class="bt"><button class="btn pr" id="ab">${has?'دخول':'إنشاء الحساب'}</button></div>${has?'<p style="text-align:center"><a href="#" id="af" style="font-size:13px">نسيت كلمة المرور؟</a></p>':''}</div>`;document.body.appendChild(o);
const E=$('#ae'),enter=()=>{o.remove();document.body.classList.remove('lk');idle();go()};
$('#ab').onclick=async()=>{const u=$('#au').value.trim(),p=$('#ap').value;if(!has){if(!u||p.length<8)return E.textContent='أدخل اسم مستخدم وكلمة مرور من 8 أحرف على الأقل.';if(p!=$('#ap2').value)return E.textContent='كلمتا المرور غير متطابقتين.'}
try{E.textContent='';const j=await api('POST',has?'/api/login':'/api/setup',has?{u,p}:{u,p,code:$('#ac').value});TOK=j.token;sessionStorage.setItem('ra_tok',TOK);sessionStorage.setItem('ra_u',j.u);await loadData();enter()}catch(e){E.textContent=e.message}};
o.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key=='Enter')$('#ab').click()});
const f=$('#af');if(f)f.onclick=e=>{e.preventDefault();openM('استرجاع كلمة المرور');setM('<p>لإعادة التعيين: ادخل إلى MongoDB Atlas ← Browse Collections ← قاعدة referee_assign ← kv، واحذف المستند الذي قيمة _id فيه admin، ثم أعد فتح الصفحة لإنشاء حساب جديد. بياناتك لا تُحذف.</p>',[{t:'إغلاق',f:closeM}])};
$('#au').focus()}
authInit();
