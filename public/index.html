<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تعيينات الحكام</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f5f2;--cd:#fff;--tx:#17231c;--mt:#5d6b62;--bd:#d9e0da;--pr:#0b6e4f;--pt:#fff;--ps:#e3f1ea;--rd:#c62828;--rs:#fdeaea;--ok:#2e7d32;--lt:#fff3d6;--ltt:#6b4e00;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101613;--cd:#18211c;--tx:#e8efea;--mt:#9bab9f;--bd:#2c3a31;--pr:#3fb68b;--pt:#07130e;--ps:#1d2f26;--rd:#ff6b6b;--rs:#3a1c1c;--ok:#6fcf74;--lt:#3a3322;--ltt:#f0d58a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,sans-serif;font-size:15px}
.side{position:fixed;top:0;bottom:0;right:0;width:230px;background:var(--pr);color:var(--pt);padding:14px 10px;overflow:auto;z-index:20;transition:transform .2s}
.side h1{font-size:18px;margin:4px 8px 14px;font-weight:800}
.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:8px;color:inherit;text-decoration:none;cursor:pointer;margin-bottom:2px}
.side a:hover{background:rgba(255,255,255,.15)}.side a.on{background:var(--pt);color:var(--pr);font-weight:800}
.bg{background:var(--rd);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.main{margin-right:230px;padding:16px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}.top h2{margin:0;flex:1;font-size:22px}
.mn{display:none}
.btn{font:inherit;border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 14px;border-radius:8px;cursor:pointer}
.btn.pr{background:var(--pr);color:var(--pt);border-color:var(--pr)}.btn.dg{color:var(--rd);border-color:var(--rd)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:end}
input,select,textarea{font:inherit;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);width:100%}
label{display:block;font-size:13px;color:var(--mt);margin-bottom:8px}.bar label{margin:0;min-width:130px;flex:1}
.ck{display:flex;gap:8px;align-items:center;color:var(--tx)}.ck input{width:auto}
.tw{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{background:var(--ps);font-size:13px}tr:last-child td{border-bottom:0}.ac{display:flex;gap:6px}
tr.cl{cursor:pointer}tr.cl:hover td{background:var(--ps)}
td.bad{color:var(--rd);font-weight:800;background:var(--rs);outline:1px solid var(--rd);outline-offset:-1px}
.em{text-align:center;color:var(--mt);padding:24px}
.gh{background:var(--pr);color:var(--pt);padding:8px 14px;border-radius:10px 10px 0 0;font-weight:800;margin-top:16px}
.gh+.tw{border-radius:0 0 10px 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}.card b{display:block;font-size:28px;color:var(--pr)}.card span{color:var(--mt);font-size:13px}
.card.cf{border-color:var(--rd);background:var(--rs);cursor:pointer}.card.cf b{color:var(--rd)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.md{background:var(--cd);border-radius:12px;padding:18px;width:100%;max-width:460px;max-height:92vh;overflow:auto}.md.w{max-width:760px}
.md h3{margin:0 0 12px}.bt{display:flex;gap:8px;margin-top:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.rs{border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}.rs.bad{border:2px solid var(--rd);background:var(--rs)}.rs.bad select{color:var(--rd);font-weight:800}
.wn{color:var(--rd);font-size:13px;margin-top:4px}option.bd{color:#c62828}
tr.lt td{background:var(--lt);color:var(--ltt)}tr.lt td[colspan]{white-space:normal;font-size:13px}.lb{background:var(--ltt);color:var(--lt);border-radius:10px;padding:1px 8px;font-size:12px;white-space:nowrap}.pv tr.lt td{background:#fff3d6;color:#6b4e00}.pv .lb{background:#6b4e00;color:#fff3d6}
.err{color:var(--rd);font-size:13px;min-height:18px}
.hd{display:flex;align-items:center;justify-content:center;gap:18px;margin-bottom:8px;padding-bottom:8px;border-bottom:2px solid #0b6e4f}.hd img{max-height:80px;max-width:130px}.h1{font-weight:800;font-size:22px}.h2{font-weight:600;font-size:14px;letter-spacing:.5px}.ct{white-space:nowrap;overflow:hidden;text-align:center;font-size:12px;border-top:2px solid #0b6e4f;padding-top:6px;margin-top:14px}
.ok{color:var(--ok)}.tg{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 18px;border-radius:8px;z-index:99}
.pv{background:#fff;color:#111;padding:18px;border-radius:10px;border:1px solid var(--bd)}.pv table,.pv .tw{background:#fff;color:#111}.pv th{background:#e3f1ea;color:#111}.pv td,.pv th{border:1px solid #bbb}
.pv th,.pv td{text-align:center;vertical-align:middle}.pv h2{text-align:center;margin:0}.pv .ft{margin-top:14px;text-align:center;font-size:13px;color:#444}
.cat{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--ps);border-radius:14px;padding:3px 10px;margin:3px}.chip button{border:0;background:none;color:var(--rd);cursor:pointer}
@media(max-width:800px){.side{transform:translateX(100%)}.side.op{transform:none}.main{margin:0;padding:12px}.mn{display:block}.g2{grid-template-columns:1fr}}
@media print{.side,.top,.noprint,.tg{display:none!important}.main{margin:0;padding:0}body{background:#fff}.pv{border:0;padding:30px;-webkit-print-color-adjust:exact;print-color-adjust:exact}tr{break-inside:avoid}.gh,.pv th{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.lk .side,.lk .main{display:none}
.mt{display:inline-flex;align-items:center;gap:7px;vertical-align:middle}.tl{height:20px;width:auto;max-width:30px;object-fit:contain}
</style>
</head>
<body class="lk">
<div class="side" id="sd"></div>
<div class="main"><div class="top"><button class="btn mn" onclick="sd.classList.toggle('op')" aria-label="القائمة">☰</button><h2 id="ti"></h2><button class="btn noprint" onclick="logout()">خروج</button><button class="btn pr noprint" onclick="mform()">+ مقابلة</button></div><div id="pg"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
const K='refassign1',$=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),fd=d=>d?d.replaceAll('-','/'):'';
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{ref:[],teams:[],stad:[],cats:[],rounds:['الجولة الأولى','الجولة الثانية','الجولة الثالثة','ربع النهائي','نصف النهائي','النهائي'].map(n=>({id:uid(),name:n})),matches:[],set:{app:'تعيينات الحكام',tour:'',block:false,unset:'غير معين',footer:''}};
let TOK=sessionStorage.getItem('ra_tok')||'',stT;
const save=()=>sync();
function sync(){if(!TOK)return;clearTimeout(stT);stT=setTimeout(async()=>{try{await api('PUT','/api/data',{data:S})}catch(e){toast('تعذر الحفظ على الخادم، تحقق من الاتصال')}},600)}
function mig(){S.set={l1:'الرابطة الولائية لكرة القدم',l2:'LIGUE WILAYA DE FOOTBALL ELOUED',phL:'الهاتف',emL:'البريد الإلكتروني',webL:'الموقع الإلكتروني',adL:'العنوان',phS:true,emS:true,webS:true,adS:true,...S.set};S.progs??=[];S.matches.forEach(m=>{m.status??='scheduled';m.moves??=0});if(!S.progs.length&&S.matches.length){const d=S.matches.map(m=>m.date).filter(Boolean).sort();S.progs.push({id:uid(),name:'البرمجة رقم 01',from:d[0]||'',to:d[d.length-1]||''})}const p0=S.progs[0];S.matches.forEach(m=>{if(!m.prog&&p0){m.prog=p0.id;m.orig=p0.id}});save()}
mig();
const by=(a,id)=>S[a].find(x=>x.id==id),nm=(a,id)=>by(a,id)?.name||'—',
gn=(c,g)=>by('cats',c)?.groups.find(x=>x.id==g)?.name||'—',
toast=t=>{const e=document.createElement('div');e.className='tg';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)};
let page='dash',sv={q:'',f:{},pm:'with',one:''};
const conf=(r,m)=>m.date&&m.time?S.matches.filter(x=>x.id!=m.id&&x.date==m.date&&x.time==m.time&&x.refs.includes(r)):[];
const cdesc=(r,c)=>`${nm('ref',r)} لديه تعيين آخر يوم ${fd(c.date)} الساعة ${c.time} في مقابلة ${nm('teams',c.t1)} × ${nm('teams',c.t2)} على ${nm('stad',c.stad)}`;
function allConf(){const mp={};S.matches.forEach(m=>m.refs.forEach(r=>{if(r&&m.date&&m.time){(mp[r+'|'+m.date+'|'+m.time]??=[]).push(m)}}));return Object.entries(mp).filter(e=>e[1].length>1).map(e=>({r:e[0].split('|')[0],ms:e[1]}))}
const hasConf=m=>m.refs.some(r=>r&&conf(r,m).length);
/* modal */
let mEl;const closeM=()=>{mEl&&mEl.remove();mEl=null};
function openM(t,w){closeM();mEl=document.createElement('div');mEl.className='ov';mEl.innerHTML=`<div class="md${w?' w':''}"><h3>${t}</h3><div class="mb"></div><div class="bt"></div></div>`;document.body.appendChild(mEl)}
function setM(b,btns){const md=mEl.querySelector('.md'),sc=md.scrollTop;mEl.querySelector('.mb').innerHTML=b;const f=mEl.querySelector('.bt');f.innerHTML='';btns.forEach(x=>{const e=document.createElement('button');e.className='btn '+(x.c||'');e.textContent=x.t;e.onclick=x.f;f.appendChild(e)});md.scrollTop=sc}
const ask=(msg,cb)=>{openM('تأكيد');setM(`<p>${msg}</p>`,[{t:'تأكيد',c:'dg',f:()=>{closeM();cb()}},{t:'إلغاء',f:closeM}])};
const opt=(o,v)=>o.map(x=>`<option value="${x[0]}" ${x[0]==v?'selected':''}>${esc(x[1])}</option>`).join('');
function imgSmall(f,cb,m=96){if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/png'))};im.src=r.result};r.readAsDataURL(f)}
const tl=id=>{const t=by('teams',id);return t&&t.logo?`<img class="tl" src="${t.logo}" alt="">`:''};
function gform(title,fields,v,cb){openM(title);
const sync=()=>mEl.querySelectorAll('[data-k]').forEach(e=>v[e.dataset.k]=e.type=='checkbox'?e.checked:e.value);
const draw=()=>{setM(fields.map(f=>f.t=='logo'?`<label>${f.l}<input type="file" accept="image/*" data-lg="${f.k}"></label>${v[f.k]?`<div style="margin:0 0 8px"><img src="${v[f.k]}" style="height:44px;vertical-align:middle" alt=""> <button class="btn dg" data-rm="${f.k}">حذف الشعار</button></div>`:''}`:f.t=='chk'?`<label class="ck"><input type="checkbox" data-k="${f.k}" ${v[f.k]?'checked':''}> ${f.l}</label>`:f.t=='sel'?`<label>${f.l}<select data-k="${f.k}"><option value="">— اختر —</option>${opt(f.o(v),v[f.k])}</select></label>`:`<label>${f.l}<input data-k="${f.k}" type="${f.t||'text'}" value="${esc(v[f.k]??'')}"></label>`).join('')+'<div class="err" id="er"></div>',
[{t:'حفظ',c:'pr',f:()=>{sync();const x=fields.find(f=>f.r&&!v[f.k]);if(x)return $('#er').textContent='الرجاء تعبئة الحقل: '+x.l;cb(v)}},{t:'إلغاء',f:closeM}]);
mEl.querySelectorAll('[data-k]').forEach(e=>e.onchange=()=>{sync();const f=fields.find(x=>x.k==e.dataset.k);if(f.rs)v[f.rs]='';if(e.tagName=='SELECT')draw()});mEl.querySelectorAll('[data-lg]').forEach(e=>e.onchange=()=>{sync();imgSmall(e.files[0],d=>{v[e.dataset.lg]=d;draw()})});mEl.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{sync();v[b.dataset.rm]='';draw()})};draw()}
/* entities */
const catO=()=>S.cats.map(c=>[c.id,c.name]);
const E={
ref:{t:'الحكم',f:[{k:'name',l:'الاسم الكامل',r:1},{k:'phone',l:'رقم الهاتف (اختياري)',t:'tel'},{k:'notes',l:'ملاحظات (اختياري)'},{k:'active',l:'نشط',t:'chk'}],d:{active:true},c:[['الاسم',r=>esc(r.name)],['الهاتف',r=>esc(r.phone)],['ملاحظات',r=>esc(r.notes)],['الحالة',r=>r.active?'<span class="ok">نشط</span>':'غير نشط']]},
teams:{t:'الفريق',f:[{k:'name',l:'اسم الفريق',r:1},{k:'cat',l:'الصنف',t:'sel',o:catO,r:1,rs:'grp'},{k:'grp',l:'المجموعة',t:'sel',o:v=>(by('cats',v.cat)?.groups||[]).map(g=>[g.id,g.name]),r:1},{k:'logo',l:'شعار الفريق (اختياري)',t:'logo'}],c:[['الشعار',r=>r.logo?`<img src="${r.logo}" style="height:28px" alt="">`:''],['الفريق',r=>esc(r.name)],['الصنف',r=>esc(nm('cats',r.cat))],['المجموعة',r=>esc(gn(r.cat,r.grp))]]},
stad:{t:'الملعب',f:[{k:'name',l:'اسم الملعب',r:1},{k:'loc',l:'الموقع (اختياري)'},{k:'notes',l:'ملاحظات (اختياري)'}],c:[['الملعب',r=>esc(r.name)],['الموقع',r=>esc(r.loc)],['ملاحظات',r=>esc(r.notes)]]},
rounds:{t:'الجولة',f:[{k:'name',l:'اسم الجولة',r:1}],c:[['الجولة',r=>esc(r.name)]]}};
function usedBy(k,id){const M=S.matches;return k=='ref'?M.some(m=>m.refs.includes(id)):k=='teams'?M.some(m=>m.t1==id||m.t2==id):k=='stad'?M.some(m=>m.stad==id):k=='rounds'?M.some(m=>m.round==id):k=='cats'?M.some(m=>m.cat==id)||S.teams.some(t=>t.cat==id):false}
function edit(k,id){const e=E[k],o=id?by(k,id):null;gform((o?'تعديل ':'إضافة ')+e.t,e.f,o?{...o}:{...(e.d||{})},v=>{if(o)Object.assign(o,v);else S[k].push({...v,id:uid()});save();closeM();go();toast('تم الحفظ')})}
function del(k,id){if(usedBy(k,id))return toast('لا يمكن الحذف: العنصر مستخدم في مقابلات');ask('هل تريد حذف هذا العنصر نهائيًا؟',()=>{S[k]=S[k].filter(x=>x.id!=id);save();go()})}
function crud(k){const e=E[k],q=sv.q.trim();const rows=S[k].filter(r=>!q||e.c.some(c=>String(c[1](r)).includes(q)));
return `<div class="bar"><input id="sq" placeholder="بحث..." value="${esc(sv.q)}" oninput="sv.q=this.value;go()"><button class="btn pr" onclick="edit('${k}')">+ إضافة</button></div><div class="tw"><table><tr>${e.c.map(c=>`<th>${c[0]}</th>`).join('')}<th></th></tr>${rows.map(r=>`<tr>${e.c.map(c=>`<td>${c[1](r)}</td>`).join('')}<td class="ac"><button class="btn" onclick="edit('${k}','${r.id}')">تعديل</button><button class="btn dg" onclick="del('${k}','${r.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="9" class="em">لا توجد بيانات بعد. اضغط «إضافة» للبدء.</td></tr>'}</table></div>`}
/* cats */
const pCats=()=>`<div class="bar"><button class="btn pr" onclick="catEdit()">+ إضافة صنف</button></div>`+(S.cats.map(c=>`<div class="cat"><div class="bar" style="margin:0 0 6px"><b style="flex:1">${esc(c.name)}</b><button class="btn" onclick="grpAdd('${c.id}')">+ مجموعة</button><button class="btn" onclick="catEdit('${c.id}')">تعديل</button><button class="btn dg" onclick="del('cats','${c.id}')">حذف</button></div>${c.groups.map(g=>`<span class="chip">${esc(g.name)}<button title="تعديل" style="color:var(--pr)" onclick="grpAdd('${c.id}','${g.id}')">✎</button><button title="حذف" onclick="grpDel('${c.id}','${g.id}')">✕</button></span>`).join('')||'<span class="em">لا توجد مجموعات</span>'}</div>`).join('')||'<div class="em">أضف صنفًا ثم مجموعاته (مثال: الأشبال ← المجموعة الأولى).</div>');
function catEdit(id){const o=id&&by('cats',id);gform(o?'تعديل الصنف':'إضافة صنف',[{k:'name',l:'اسم الصنف',r:1}],{name:o?.name||''},v=>{if(o)o.name=v.name;else S.cats.push({id:uid(),name:v.name,groups:[]});save();closeM();go()})}
function grpAdd(c,g){const C=by('cats',c),o=g&&C.groups.find(x=>x.id==g);gform('المجموعة',[{k:'name',l:'اسم المجموعة',r:1}],{name:o?.name||''},v=>{if(o)o.name=v.name;else C.groups.push({id:uid(),name:v.name});save();closeM();go()})}
function grpDel(c,g){if(S.matches.some(m=>m.grp==g)||S.teams.some(t=>t.grp==g))return toast('لا يمكن الحذف: المجموعة مستخدمة');ask('حذف المجموعة؟',()=>{const C=by('cats',c);C.groups=C.groups.filter(x=>x.id!=g);save();go()})}
/* match form */
function mform(id,pg,mode){if(mode!='refs'&&!id&&!S.progs.length)return toast('أنشئ برمجة أولًا من «برمجة المقابلات»');const RM=mode=='refs',old=id&&by('matches',id);const m=old?JSON.parse(JSON.stringify(old)):{id:uid(),prog:pg||sv.prog||latest()?.id||'',status:'scheduled',moves:0,round:'',cat:'',grp:'',date:'',time:'',stad:'',t1:'',t2:'',refs:['','',''],notes:''};let okc=false;
openM(RM?'تعيين الحكام':old?'تعديل المقابلة':'مقابلة جديدة',1);
const sel=(k,l,o)=>`<label>${l}<select data-k="${k}"><option value="">— اختر —</option>${opt(o,m[k])}</select></label>`;
const draw=()=>{okc=false;const gs=(by('cats',m.cat)?.groups||[]).map(g=>[g.id,g.name]),tm=S.teams.filter(t=>t.cat==m.cat&&t.grp==m.grp).map(t=>[t.id,t.name]);
